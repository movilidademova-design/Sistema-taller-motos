# ─────────────────────────────────────────────────────────────────────────────
# Nginx para STAGING — dos dominios, uno para el frontend y otro para la API.
#
# Se instala en el SERVIDOR (no en Docker):
#   sudo cp nginx/staging.conf /etc/nginx/sites-available/taller-staging
#   sudo ln -s /etc/nginx/sites-available/taller-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este archivo es el estado ANTES de certbot. Al ejecutar certbot, él mismo
# reescribe estos bloques añadiendo el 443 y la redirección desde el 80.
#
# Sustituye staging.tudominio.com por tu dominio real en los 4 sitios.
# ─────────────────────────────────────────────────────────────────────────────

# Limita las peticiones a los archivos subidos. Los estáticos NO pasan por el
# limitador de la aplicación (comprobado: 120 peticiones seguidas, 0 respuestas
# 429), así que el freno se pone aquí. Es por disponibilidad, no por
# confidencialidad: los nombres son UUID v4 y no se pueden adivinar.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/s;

server {
    listen 80;
    server_name staging.tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api-staging.tudominio.com;

    # Las fotos de recepción pesan. El tope real lo aplica la API (8 MB por
    # archivo); aquí se deja algo de margen para el sobre multipart completo,
    # que en el asistente de recepción puede llevar hasta 10 fotos y la firma.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para el WebSocket. Hoy el frontend no se conecta (ver
        # CODE_AUDIT.md, hallazgo B-4), pero el servidor sí escucha y esto
        # evita que el día que se conecte falle sin motivo aparente.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # La generación de PDF y las exportaciones a Excel pueden tardar.
        proxy_read_timeout 120s;
    }

    # Archivos subidos: mismo destino, pero con freno de peticiones.
    location /uploads/ {
        limit_req zone=uploads burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Estos archivos son públicos por decisión consciente (ver
        # C2_DECISION.md, Opción A). Se marcan como privados en las cachés
        # intermedias para que al menos no queden guardados en proxies ajenos.
        add_header Cache-Control "private, max-age=3600";
    }
}
